<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3a86ff">
<title data-en="Count With Me">Conta Comigo</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
body{font-family:'Fredoka','Trebuchet MS',sans-serif;background:linear-gradient(170deg,#4cc9f0,#3a86ff 55%,#5e60ce);color:#1d2b5a}
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;z-index:10;gap:8px}
.btn{border:none;background:#fff;border-radius:18px;font-size:28px;width:56px;height:56px;flex:none;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 5px 0 rgba(0,0,0,.15);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
#stars{display:flex;gap:2px;font-size:clamp(16px,4vw,28px);background:rgba(255,255,255,.25);padding:6px 10px;border-radius:20px}
#stars span{filter:grayscale(1);opacity:.35;transition:.4s}
#stars span.on{filter:none;opacity:1;animation:pop .5s}
main{position:fixed;inset:0;padding:80px 16px 18px;display:flex;flex-direction:column;gap:14px}
.q{text-align:center;color:#fff;font-size:clamp(24px,5.5vw,42px);font-weight:700;text-shadow:0 4px 0 rgba(0,0,0,.18)}
.hint{text-align:center;color:#fff;opacity:.9;font-size:clamp(14px,3vw,19px);margin-top:-10px}
#field{flex:1;min-height:0;background:rgba(255,255,255,.9);border-radius:32px;box-shadow:0 10px 0 rgba(0,0,0,.12);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:4px 10px;padding:14px;overflow:hidden}
.obj{position:relative;line-height:1.1;cursor:pointer;animation:popIn .45s cubic-bezier(.3,1.6,.5,1) backwards;transition:transform .2s}
.obj:active{transform:scale(.9)}
.obj.counted{transform:scale(.92);filter:saturate(1.2)}
.obj .n{position:absolute;top:-4px;right:-6px;background:#ff5d8f;color:#fff;font-size:.32em;font-weight:700;min-width:1.5em;height:1.5em;border-radius:1em;display:flex;align-items:center;justify-content:center;border:3px solid #fff;animation:pop .35s}
@keyframes popIn{from{transform:scale(0) rotate(-30deg);opacity:0}}
@keyframes pop{50%{transform:scale(1.4)}}
#answers{display:flex;justify-content:center;gap:clamp(12px,4vw,30px);padding-bottom:6px}
.ans{border:none;width:min(26vw,120px,15vh);aspect-ratio:1;border-radius:50%;font-family:inherit;font-weight:700;font-size:min(13vw,60px,8vh);color:#fff;background:var(--c);box-shadow:0 8px 0 rgba(0,0,0,.2);cursor:pointer;transition:transform .15s,opacity .3s}
.ans:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.ans.ok{background:#0ead69;animation:pop .5s}
.ans.no{opacity:.3;animation:shake .4s;pointer-events:none}
@keyframes shake{25%{transform:translateX(-10px) rotate(-6deg)}75%{transform:translateX(10px) rotate(6deg)}}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,30,80,.45);z-index:50;padding:16px}
.overlay.show{display:flex}
.card{background:#fff;border-radius:34px;padding:28px 22px;text-align:center;max-width:480px;width:100%;box-shadow:0 12px 0 rgba(0,0,0,.12);animation:pop2 .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop2{from{transform:scale(.5);opacity:0}}
.card .big{font-size:90px;line-height:1;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(6deg)}}
.card h2{font-size:clamp(28px,6vw,40px);color:#3a86ff;margin:10px 0}
.card p{font-size:20px;margin-bottom:18px}
.play{border:none;border-radius:24px;background:linear-gradient(135deg,#3bceac,#0ead69);color:#fff;font-family:inherit;font-size:30px;font-weight:700;padding:14px 40px;box-shadow:0 7px 0 rgba(0,0,0,.18);cursor:pointer}
.play:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:100}
</style>
</head>
<body>
<div class="top"><a class="btn" href="../index.html">🏠</a><div id="stars"></div><button class="btn" id="say">🔊</button></div>
<main>
  <div class="q" id="q"></div>
  <div class="hint" data-en="👆 Tap each one to count">👆 Toque em cada um para contar</div>
  <div id="field"></div>
  <div id="answers"></div>
</main>
<div id="start" class="overlay show"><div class="card"><div class="big">🔢</div><h2 data-en="Count With Me">Conta Comigo</h2><p data-en="Let's count together!">Vamos contar juntos?</p><button class="play" id="go" data-en="▶ Play">▶ Jogar</button><br><button class="lang-toggle"></button></div></div>
<div id="end" class="overlay"><div class="card"><div class="big">🏆</div><h2 data-en="You're a champion!">Você é campeão!</h2><p>⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐</p><button class="play" id="again" data-en="🔄 Again">🔄 De novo</button></div></div>

<script src="../comum/voz.js"></script>
<script>
const AC=window.AudioContext||window.webkitAudioContext;let ac;
function tone(f,d=.15,type='sine',vol=.25,delay=0){try{ac=ac||new AC();if(ac.state==='suspended')ac.resume();const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
const sfx={tap(n){tone(400+n*60,.12,'triangle',.3)},good(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.25,i*.09))},bad(){tone(260,.18,'sine',.25);tone(200,.25,'sine',.25,.14)},win(){[523,659,784,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.25,i*.12))}};
function confetti(n=120){const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);const W=c.width=innerWidth,H=c.height=innerHeight,x=c.getContext('2d'),cl=['#ff5d8f','#ffd23f','#3bceac','#5e60ce','#ff8c42','#4cc9f0'];const ps=Array.from({length:n},()=>({x:W/2,y:H*.45,vx:(Math.random()-.5)*18,vy:-Math.random()*15-4,s:Math.random()*8+7,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cl[Math.random()*cl.length|0]}));let f=0;(function L(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<160)requestAnimationFrame(L);else c.remove()})()}

/*FALAS*/
const ITEMS=[
 {e:'🍎',n:L('maçãs','apples'),f:1},{e:'🐶',n:L('cachorrinhos','puppies')},{e:'⭐',n:L('estrelas','stars'),f:1},{e:'🐟',n:L('peixinhos','fish')},
 {e:'🎈',n:L('balões','balloons')},{e:'🦋',n:L('borboletas','butterflies'),f:1},{e:'🍓',n:L('morangos','strawberries')},{e:'🚗',n:L('carrinhos','cars')},
 {e:'🐥',n:L('pintinhos','chicks')},{e:'🌸',n:L('flores','flowers'),f:1},{e:'🍪',n:L('biscoitos','cookies')},{e:'⚽',n:L('bolas','balls'),f:1},
 {e:'🐞',n:L('joaninhas','ladybugs'),f:1},{e:'🦆',n:L('patinhos','ducklings')},{e:'🍌',n:L('bananas','bananas'),f:1},{e:'🐸',n:L('sapinhos','frogs')}
];
const F={
 q:it=>L(`Quant${it.f?'as':'os'} ${it.n} você vê?`,`How many ${it.n} do you see?`),
 qShort:it=>L(`Quant${it.f?'as':'os'} ${it.e}?`,`How many ${it.e}?`),
 ok:(it,c)=>L('Isso! '+(c===1?(it.f?'Uma':'Um')+' só!':(c===2?(it.f?'Duas':'Dois'):c)+' '+it.n+'!'),c===1?'Yes! Just one!':`Yes! ${c} ${it.n}!`),
 bad:L('Quase! Vamos contar juntos?',"Almost! Let's count together!"),
 end:L('Parabéns! Você é um campeão da contagem!','Congratulations! You are a counting champion!')
};
function falas(){const a=[F.bad,F.end];for(let i=1;i<=10;i++)a.push(String(i));ITEMS.forEach(it=>{a.push(F.q(it));for(let c=1;c<=10;c++)a.push(F.ok(it,c))});return a}
/*FIM-FALAS*/
const COLORS=['linear-gradient(135deg,#ff5d8f,#c9184a)','linear-gradient(135deg,#ffb703,#fb8500)','linear-gradient(135deg,#8338ec,#5e60ce)'];
const ROUNDS=10;let round=0,item,count,tapped,question,lock=false,lastItem;
const $=id=>document.getElementById(id);
$('stars').innerHTML='<span>⭐</span>'.repeat(ROUNDS);
$('go').onclick=()=>{$('start').classList.remove('show');startGame()};
$('again').onclick=()=>{$('end').classList.remove('show');startGame()};
$('say').onclick=()=>speak(question);

function startGame(){round=0;document.querySelectorAll('#stars span').forEach(s=>s.classList.remove('on'));next()}
function next(){
 if(round>=ROUNDS){sfx.win();confetti(200);speak(F.end);$('end').classList.add('show');return}
 lock=false;tapped=0;
 const max=round<3?5:round<6?7:10;
 do{item=ITEMS[Math.random()*ITEMS.length|0]}while(item===lastItem);lastItem=item;
 count=1+Math.floor(Math.random()*max);
 question=F.q(item);
 $('q').textContent=F.qShort(item);
 const field=$('field');field.innerHTML='';
 const fw=field.clientWidth-28,fh=field.clientHeight-28;
 const k=Math.ceil(Math.sqrt(count*fw/fh)),rr=Math.ceil(count/k);
 const fs=Math.min(fw/k,fh/rr,170)*.62;
 for(let i=0;i<count;i++){const o=document.createElement('div');o.className='obj';o.textContent=item.e;o.style.fontSize=fs+'px';o.style.animationDelay=(i*.08)+'s';
  o.style.rotate=((Math.random()-.5)*20)+'deg';
  o.onclick=()=>{if(o.classList.contains('counted'))return;tapped++;o.classList.add('counted');const b=document.createElement('span');b.className='n';b.textContent=tapped;o.appendChild(b);sfx.tap(tapped);speak(String(tapped))};
  field.appendChild(o)}
 const opts=new Set([count]);
 while(opts.size<3){let v=count+Math.round((Math.random()-.5)*6);if(v>=1&&v<=10)opts.add(v)}
 const ans=$('answers');ans.innerHTML='';
 [...opts].sort((a,b)=>a-b).forEach((v,i)=>{const b=document.createElement('button');b.className='ans';b.textContent=v;b.style.setProperty('--c',COLORS[i]);b.onclick=()=>answer(b,v);ans.appendChild(b)});
 speak.preload([question,F.ok(item,count),F.bad].concat(Array.from({length:count},(_,i)=>String(i+1))));
 setTimeout(()=>speak(question),400);
}
function answer(b,v){if(lock)return;
 if(v===count){lock=true;b.classList.add('ok');sfx.good();confetti(80);
  document.querySelectorAll('#stars span')[round].classList.add('on');
  speak(F.ok(item,count));
  round++;setTimeout(next,2000)}
 else{b.classList.add('no');sfx.bad();speak(F.bad)}
}
</script>
</body>
</html>
