<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3d5a80">
<title data-en="Odd One Out Detective">Detetive do Intruso</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--ol:#2d1b4e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
body{font-family:'Lilita One','Comic Sans MS','Chalkboard SE',cursive;color:var(--ol);letter-spacing:.5px;
 background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 60px,transparent 60px 120px),linear-gradient(#5b7db1,#3d5a80)}
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;z-index:20;gap:8px}
.btn{border:5px solid var(--ol);background:#fff;border-radius:18px;font-size:26px;width:58px;height:58px;flex:none;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 5px 0 var(--ol);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ol)}
#stars{display:flex;gap:1px;font-size:clamp(14px,3.6vw,26px);background:#fff;border:5px solid var(--ol);box-shadow:0 5px 0 var(--ol);padding:4px 8px;border-radius:20px}
#stars span{filter:grayscale(1);opacity:.3;transition:.4s}
#stars span.on{filter:none;opacity:1;animation:boing .5s}
main{position:fixed;inset:0;padding:82px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.det{display:flex;align-items:center;gap:10px}
.det .face{font-size:clamp(48px,11vw,72px);line-height:1;animation:bob 2.4s ease-in-out infinite}
.bubble{position:relative;background:#fff;border:6px solid var(--ol);border-radius:24px;padding:8px 18px;font-size:clamp(20px,5vw,34px);box-shadow:0 6px 0 var(--ol);cursor:pointer}
.bubble::before{content:'';position:absolute;left:-17px;top:50%;width:22px;height:22px;background:#fff;border-left:6px solid var(--ol);border-bottom:6px solid var(--ol);transform:translateY(-50%) rotate(45deg);border-radius:0 0 0 6px}
#board{flex:1;min-height:0;width:min(100%,760px);position:relative;border:8px solid #7a4a24;outline:5px solid var(--ol);border-radius:22px;box-shadow:0 10px 0 var(--ol);
 background:radial-gradient(circle,rgba(0,0,0,.12) 2px,transparent 3px) 0 0/18px 18px,radial-gradient(circle,rgba(255,255,255,.12) 2px,transparent 3px) 9px 9px/18px 18px,#d9a066;
 display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:clamp(12px,3vw,26px);padding:18px}
.pc{position:relative;background:#fff;border:5px solid var(--ol);border-radius:10px;padding:10px 10px 22px;box-shadow:0 7px 0 rgba(45,27,78,.6);transform:rotate(var(--r));cursor:pointer;transition:transform .2s,box-shadow .3s,opacity .3s;animation:pin .5s cubic-bezier(.3,1.6,.5,1) backwards}
.pc::before{content:'';position:absolute;top:-14px;left:50%;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#e63946;border:4px solid var(--ol);box-shadow:inset -4px -4px 0 rgba(0,0,0,.2)}
.pc .e{display:flex;align-items:center;justify-content:center;width:var(--c);height:var(--c);font-size:calc(var(--c)*.72);line-height:1;background:#eef4ff;border-radius:6px}
.pc:active{transform:rotate(var(--r)) scale(.95)}
.pc.no{animation:shake .45s}
.pc.match{box-shadow:0 0 0 7px #8ac926,0 7px 0 rgba(45,27,78,.6)}
.pc.found{transform:rotate(0) scale(1.1);z-index:3}
.pc.dim{opacity:.55}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-16deg);border:5px solid #e63946;color:#e63946;background:rgba(255,255,255,.85);border-radius:10px;padding:2px 10px;font-size:calc(var(--c)*.2);white-space:nowrap;animation:stamp .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-16deg) scale(2.6);opacity:0}}
.lupa{position:fixed;font-size:64px;pointer-events:none;z-index:40;animation:lupa .45s ease-in-out}
@keyframes lupa{0%{transform:translate(-50%,-50%) scale(.3) rotate(-30deg);opacity:0}50%{transform:translate(-30%,-60%) scale(1.1) rotate(10deg);opacity:1}100%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:0}}
@keyframes pin{from{transform:translateY(-60px) rotate(0) scale(.6);opacity:0}}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
@keyframes boing{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{20%{transform:translateX(-10px) rotate(-6deg)}40%{transform:translateX(9px) rotate(6deg)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-20px) rotate(8deg)}}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,20,50,.5);z-index:80;padding:16px}
.overlay.show{display:flex}
.box{background:#fff;border:7px solid var(--ol);border-radius:36px;padding:26px 22px;text-align:center;max-width:480px;width:100%;box-shadow:0 12px 0 var(--ol);animation:boing .5s}
.box .big{font-size:92px;line-height:1;animation:dance 1.2s ease-in-out infinite}
.box h2{font-size:clamp(28px,7vw,42px);color:#3d5a80;margin:12px 0;text-shadow:3px 3px 0 #ffd23f}
.box p{font-size:22px;margin-bottom:18px}
.play{border:6px solid var(--ol);border-radius:24px;background:#8ac926;color:#fff;font-family:inherit;font-size:32px;padding:10px 36px;box-shadow:0 7px 0 var(--ol);cursor:pointer;text-shadow:2px 2px 0 var(--ol)}
.play:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ol)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
</style>
</head>
<body>
<div class="top"><a class="btn" href="../index.html">🏠</a><div id="stars"></div><button class="btn" id="say">🔊</button></div>
<main>
  <div class="det"><div class="face">🕵️</div><div class="bubble" id="bubble" data-en="Which one doesn't belong?">Qual não combina?</div></div>
  <div id="board"></div>
</main>
<div id="start" class="overlay show"><div class="box"><div class="big">🕵️</div><h2 data-en="Odd One Out Detective">Detetive do Intruso</h2><p data-en="Find the picture that doesn't belong with the others!">Encontre a figura que não combina com as outras!</p><button class="play" id="go" data-en="▶ PLAY">▶ JOGAR</button><br><button class="lang-toggle"></button></div></div>
<div id="end" class="overlay"><div class="box"><div class="big">🏅</div><h2 data-en="Super Detective!">Super Detetive!</h2><p data-en="You solved every case! 🔍">Você resolveu todos os casos! 🔍</p><button class="play" id="again" data-en="🔄 AGAIN">🔄 DE NOVO</button></div></div>

<script src="../comum/voz.js"></script>
<script>
const AC=window.AudioContext||window.webkitAudioContext;let ac;
function tone(f,d=.15,type='sine',vol=.25,delay=0,f2){try{ac=ac||new AC();if(ac.state==='suspended')ac.resume();const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
function confetti(n=160){const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);const W=c.width=innerWidth,H=c.height=innerHeight,x=c.getContext('2d'),cl=['#ff5d8f','#ffd23f','#3bceac','#5e60ce','#ff8c42','#4cc9f0'];const ps=Array.from({length:n},()=>({x:W/2,y:H*.4,vx:(Math.random()-.5)*18,vy:-Math.random()*15-4,s:Math.random()*9+8,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cl[Math.random()*cl.length|0]}));let f=0;(function Lp(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.strokeStyle='#2d1b4e';x.lineWidth=2;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.strokeRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<170)requestAnimationFrame(Lp);else c.remove()})()}
const $=id=>document.getElementById(id);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];

/*FALAS*/
// vs = de quais categorias pode vir o intruso (sem ambiguidade)
const CATS={
 frutas:{it:['🍎','🍌','🍇','🍓','🍊','🍉','🍐','🍒'],vs:['veiculos','roupas','animais'],ok:L('Isso! Os outros são todos frutas!','Yes! All the others are fruits!')},
 animais:{it:['🐶','🐱','🐰','🐷','🐵','🐮','🦁','🐴'],vs:['frutas','veiculos','roupas'],ok:L('Isso! Os outros são todos animais!','Yes! All the others are animals!')},
 veiculos:{it:['🚗','🚌','🚂','✈️','🚀','🚲','🚁','🚢'],vs:['frutas','animais','doces'],ok:L('Isso! Os outros são todos meios de transporte!','Yes! All the others are vehicles!')},
 roupas:{it:['👕','👖','👗','🧢','👟','🧦','🧤','🧣'],vs:['frutas','veiculos','instrumentos'],ok:L('Isso! Os outros são todos roupas!','Yes! All the others are clothes!')},
 doces:{it:['🍰','🍦','🍩','🍪','🍫','🍭','🧁','🍬'],vs:['veiculos','roupas','animais'],ok:L('Isso! Os outros são todos doces!','Yes! All the others are sweets!')},
 agua:{it:['🐟','🐙','🐳','🦈','🦀','🐬','🐠','🦭'],vs:['animais','voam'],ok:L('Isso! Os outros vivem na água!','Yes! The others live in the water!')},
 voam:{it:['🐦','🦋','🐝','🦅','🦉','🦇','🦜'],vs:['animais','agua'],ok:L('Isso! Os outros sabem voar!','Yes! The others can fly!')},
 instrumentos:{it:['🎸','🥁','🎺','🎹','🎻','🎷'],vs:['frutas','animais','doces'],ok:L('Isso! Os outros são instrumentos musicais!','Yes! The others are musical instruments!')},
 vermelho:{it:['🍎','🍓','🍒','🚒','🌹','❤️','🍅','🐞'],vs:['amarelo','verde'],ok:L('Isso! Os outros são todos vermelhos!','Yes! All the others are red!')},
 amarelo:{it:['🍌','🌻','⭐','🌽','🍋','🐥','🧀','☀️'],vs:['vermelho','verde'],ok:L('Isso! Os outros são todos amarelos!','Yes! All the others are yellow!')},
 verde:{it:['🥦','🐸','🍏','🥒','🌲','🦖','🥝','🍀'],vs:['vermelho','amarelo'],ok:L('Isso! Os outros são todos verdes!','Yes! All the others are green!')}
};
const F={
 start:L('Encontre o intruso! Qual não combina com os outros?',"Find the odd one out! Which one doesn't belong?"),
 next:L('Qual não combina?',"Which one doesn't belong?"),
 no:L('Hmm, esse combina com os outros. Procure de novo!','Hmm, that one matches the others. Look again!'),
 end:L('Parabéns, detetive! Você achou todos os intrusos!','Great job, detective! You found all the odd ones out!')
};
function falas(){return [F.start,F.next,F.no,F.end].concat(Object.values(CATS).map(c=>c.ok))}
/*FIM-FALAS*/

const POOLS=[['frutas','animais','veiculos','doces','roupas'],['agua','voam','instrumentos','roupas','doces','veiculos'],['vermelho','amarelo','verde']];
const ROUNDS=10;let round=0,cat,intruder,busy=true,last;
const board=$('board');
$('stars').innerHTML='<span>⭐</span>'.repeat(ROUNDS);
$('go').onclick=()=>{$('start').classList.remove('show');startGame()};
$('again').onclick=()=>{$('end').classList.remove('show');startGame()};
$('say').onclick=$('bubble').onclick=()=>{if(!busy)speak(F.next)};

function startGame(){round=0;document.querySelectorAll('#stars span').forEach(s=>s.classList.remove('on'));next()}
function next(){
 if(round>=ROUNDS){confetti(220);[523,659,784,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.25,i*.12));speak(F.end);$('end').classList.add('show');return}
 busy=false;
 const pool=POOLS[round<4?0:round<7?1:2];
 do{cat=pick(pool)}while(cat===last&&pool.length>1);last=cat;
 const C=CATS[cat],n=round<5?4:5;
 const group=shuffle([...C.it]).slice(0,n-1);
 const other=CATS[pick(C.vs)];
 do{intruder=pick(other.it)}while(C.it.includes(intruder));
 const cards=shuffle([...group,intruder]);
 const bw=board.clientWidth-36,bh=board.clientHeight-36;
 const cols=n===4?(bw>bh*1.6?4:2):(bw>bh*1.9?5:3),rows=Math.ceil(n/cols);
 const size=Math.floor(Math.min((bw-(cols-1)*24)/cols-30,(bh-(rows-1)*24)/rows-46,170));
 board.style.setProperty('--c',size+'px');
 board.innerHTML='';
 cards.forEach((e,i)=>{const d=document.createElement('div');d.className='pc';d.style.setProperty('--r',((Math.random()-.5)*10).toFixed(1)+'deg');d.style.animationDelay=(i*.1)+'s';d.innerHTML=`<div class="e">${e}</div>`;d.onclick=()=>choose(d,e);board.appendChild(d)});
 speak.preload([C.ok,F.no]);
 setTimeout(()=>speak(round===0?F.start:F.next),450);
}
function choose(d,e){if(busy||d.classList.contains('dim'))return;busy=true;
 const r=d.getBoundingClientRect(),l=document.createElement('div');l.className='lupa';l.textContent='🔍';l.style.left=r.left+r.width/2+'px';l.style.top=r.top+r.height/2+'px';document.body.appendChild(l);setTimeout(()=>l.remove(),450);
 tone(700,.08,'triangle',.15);tone(900,.08,'triangle',.15,.12);
 setTimeout(()=>{
  if(e===intruder){d.classList.add('found');const s=document.createElement('div');s.className='stamp';s.textContent=L('INTRUSO!','ODD ONE!');d.appendChild(s);
   tone(140,.15,'square',.2);[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.25,.2+i*.1));
   setTimeout(()=>board.querySelectorAll('.pc').forEach(p=>{if(p!==d)p.classList.add('match')}),350);
   speak(CATS[cat].ok);confetti(90);
   document.querySelectorAll('#stars span')[round].classList.add('on');round++;setTimeout(next,3200)}
  else{d.classList.remove('no');void d.offsetWidth;d.classList.add('no','dim');tone(260,.3,'sawtooth',.1,0,130);speak(F.no);busy=false}
 },450);
}

</script>
</body>
</html>
