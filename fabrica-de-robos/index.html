<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#9aa5b8">
<title data-en="Robot Factory">Fábrica de Robôs</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--ol:#2d1b4e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{font-family:'Lilita One','Comic Sans MS','Chalkboard SE',cursive;color:var(--ol);letter-spacing:.5px;
 background:linear-gradient(rgba(255,255,255,.06) 2px,transparent 2px) 0 0/40px 40px,linear-gradient(90deg,rgba(255,255,255,.06) 2px,transparent 2px) 0 0/40px 40px,linear-gradient(#ffcf5c,#ff9f43)}
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;z-index:20;gap:8px}
.btn{border:5px solid var(--ol);background:#fff;border-radius:18px;font-size:26px;width:58px;height:58px;flex:none;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 5px 0 var(--ol);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ol)}
#stars{display:flex;gap:2px;font-size:clamp(16px,4vw,28px);background:#fff;border:5px solid var(--ol);box-shadow:0 5px 0 var(--ol);padding:4px 10px;border-radius:20px}
#stars span{filter:grayscale(1);opacity:.3;transition:.4s}
#stars span.on{filter:none;opacity:1;animation:boing .5s}
main{position:fixed;inset:0;padding:80px 10px 12px;display:flex;flex-direction:column;gap:12px}
#factory{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,40px)}
.card{background:#fff;border:6px solid var(--ol);border-radius:26px;box-shadow:0 8px 0 var(--ol);padding:10px 12px 14px;display:flex;flex-direction:column;align-items:center}
.card .lbl{font-size:clamp(16px,3.6vw,24px);background:#ff5d8f;color:#fff;padding:2px 14px;border-radius:14px;border:4px solid var(--ol);margin-bottom:8px;text-shadow:2px 2px 0 var(--ol)}
#bay{position:relative;padding:14px 18px 10px;background:repeating-linear-gradient(45deg,#ffd23f 0 18px,#2d1b4e 18px 36px);border:6px solid var(--ol);border-radius:30px;box-shadow:0 8px 0 var(--ol)}
#bay::before{content:'';position:absolute;inset:10px;background:#dfe7f2;border:5px solid var(--ol);border-radius:22px}
#robot,.mini{position:relative;display:flex;flex-direction:column;align-items:center}
.slot svg,.mini svg,.part svg{display:block;width:100%;height:100%;overflow:visible}
.slot{position:relative}
.slot.snap{animation:boing .45s}
#robot.over{filter:drop-shadow(0 0 14px #fff)}
.ol{stroke:var(--ol);stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
.eye{fill:var(--ol);transition:fill .3s}
.eye2{fill:#7df9ff;transition:fill .3s}
.wheel,.hrt,.ant{transform-box:fill-box;transform-origin:center}
.alive .eye,.alive .eye2{fill:#ffe600}
.alive .wheel{animation:spin .5s linear infinite}
.alive .hrt{animation:beat .4s ease-in-out infinite}
.alive .ant{animation:flash .25s steps(2) infinite}
#robot.alive{animation:dance .55s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beat{50%{transform:scale(1.25)}}
@keyframes flash{50%{fill:#fff}}
#belt{position:relative;background:#555b6e;border:6px solid var(--ol);border-radius:28px;box-shadow:0 8px 0 var(--ol);padding:14px 10px 22px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
#belt::after{content:'';position:absolute;left:14px;right:14px;bottom:6px;height:10px;border-radius:6px;background:repeating-linear-gradient(90deg,#2d1b4e 0 12px,#9aa5b8 12px 24px);background-size:24px 10px;animation:belt .6s linear infinite}
@keyframes belt{to{background-position:24px 0}}
.part{background:#fff;border:5px solid var(--ol);border-radius:18px;box-shadow:0 5px 0 var(--ol);display:flex;align-items:center;justify-content:center;padding:8px;touch-action:none;cursor:grab;position:relative;transition:transform .45s cubic-bezier(.3,1.6,.5,1);animation:slide .5s backwards}
.part.drag{z-index:50;transition:none;box-shadow:0 14px 10px rgba(45,27,78,.3)}
.part.gone{visibility:hidden}
@keyframes slide{from{transform:translateX(-60px);opacity:0}}
@keyframes boing{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{20%{transform:translateX(-12px) rotate(-5deg)}40%{transform:translateX(10px) rotate(5deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-18px) rotate(6deg)}}
.shake{animation:shake .45s}
.bolt{position:fixed;font-size:34px;pointer-events:none;z-index:60;animation:bolt .7s forwards}
@keyframes bolt{to{transform:translate(var(--dx),var(--dy)) rotate(180deg);opacity:0}}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(45,27,78,.45);z-index:80;padding:16px}
.overlay.show{display:flex}
.box{background:#fff;border:7px solid var(--ol);border-radius:36px;padding:26px 22px;text-align:center;max-width:480px;width:100%;box-shadow:0 12px 0 var(--ol);animation:boing .5s}
.box .big{font-size:92px;line-height:1;animation:dance 1.2s ease-in-out infinite}
.box h2{font-size:clamp(30px,7vw,44px);color:#4cc9f0;margin:12px 0;text-shadow:3px 3px 0 var(--ol)}
.box p{font-size:22px;margin-bottom:18px}
.play{border:6px solid var(--ol);border-radius:24px;background:#8ac926;color:#fff;font-family:inherit;font-size:32px;padding:10px 36px;box-shadow:0 7px 0 var(--ol);cursor:pointer;text-shadow:2px 2px 0 var(--ol)}
.play:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ol)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
</style>
</head>
<body>
<div class="top"><a class="btn" href="../index.html">🏠</a><div id="stars"></div><button class="btn" id="say">🔊</button></div>
<main>
  <div id="factory">
    <div class="card"><div class="lbl" data-en="MODEL">MODELO</div><div class="mini" id="model"></div></div>
    <div id="bay"><div id="robot"></div></div>
  </div>
  <div id="belt"></div>
</main>
<div id="start" class="overlay show"><div class="box"><div class="big">🤖</div><h2 data-en="Robot Factory">Fábrica de Robôs</h2><p data-en="Build a robot just like the model and it will come to life!">Monte um robô igualzinho ao modelo e ele vai ganhar vida!</p><button class="play" id="go" data-en="▶ PLAY">▶ JOGAR</button><br><button class="lang-toggle"></button></div></div>
<div id="end" class="overlay"><div class="box"><div class="big">🏭</div><h2 data-en="Top Engineer!">Engenheiro Top!</h2><p data-en="You built all the robots! 🤖🤖🤖">Você montou todos os robôs! 🤖🤖🤖</p><button class="play" id="again" data-en="🔄 AGAIN">🔄 DE NOVO</button></div></div>

<script src="../comum/voz.js"></script>
<script>
const AC=window.AudioContext||window.webkitAudioContext;let ac;
function tone(f,d=.15,type='sine',vol=.25,delay=0,f2){try{ac=ac||new AC();if(ac.state==='suspended')ac.resume();const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
function confetti(n=160){const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);const W=c.width=innerWidth,H=c.height=innerHeight,x=c.getContext('2d'),cl=['#ff5d8f','#ffd23f','#3bceac','#5e60ce','#ff8c42','#4cc9f0'];const ps=Array.from({length:n},()=>({x:W/2,y:H*.4,vx:(Math.random()-.5)*18,vy:-Math.random()*15-4,s:Math.random()*9+8,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cl[Math.random()*cl.length|0]}));let f=0;(function L(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.strokeStyle='#2d1b4e';x.lineWidth=2;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.strokeRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<170)requestAnimationFrame(L);else c.remove()})()}
const $=id=>document.getElementById(id);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=n=>Math.random()*n|0;

/* ---------- peças desenhadas ---------- */
const PC=['#ff5d5d','#4cc9f0','#ffd23f','#6bd96b','#b07cff','#ff9f43'];
const CATS=['head','body','legs'];
const VB={head:'0 0 200 100',body:'0 0 200 100',legs:'0 0 200 90'};
const RATIO={head:.5,body:.5,legs:.45};
const ARMS=c=>`<rect class="ol" x="12" y="14" width="30" height="62" rx="15" fill="${c}"/><rect class="ol" x="158" y="14" width="30" height="62" rx="15" fill="${c}"/>`;
const NECK='<rect class="ol" x="86" y="88" width="28" height="14" fill="#9aa5b8"/>';
const DRAW={
 head:[
  c=>`${NECK}<line class="ol" x1="100" y1="28" x2="100" y2="12"/><circle class="ol ant" cx="100" cy="10" r="8" fill="#ff5d8f"/><rect class="ol" x="34" y="44" width="14" height="28" rx="5" fill="#9aa5b8"/><rect class="ol" x="152" y="44" width="14" height="28" rx="5" fill="#9aa5b8"/><rect class="ol" x="44" y="26" width="112" height="66" rx="16" fill="${c}"/><circle class="ol" cx="76" cy="55" r="14" fill="#fff"/><circle class="ol" cx="124" cy="55" r="14" fill="#fff"/><circle class="eye" cx="76" cy="55" r="6"/><circle class="eye" cx="124" cy="55" r="6"/><rect class="ol" x="80" y="74" width="40" height="10" rx="5" fill="#fff"/>`,
  c=>`${NECK}<line class="ol" x1="72" y1="40" x2="58" y2="12"/><line class="ol" x1="128" y1="40" x2="142" y2="12"/><circle class="ol ant" cx="58" cy="11" r="7" fill="#ffd23f"/><circle class="ol ant" cx="142" cy="11" r="7" fill="#ffd23f"/><path class="ol" d="M44 92V66A56 46 0 0 1 156 66V92Z" fill="${c}"/><circle class="ol" cx="100" cy="60" r="22" fill="#fff"/><circle class="eye" cx="100" cy="60" r="10"/><path class="ol" fill="none" d="M84 82Q100 90 116 82"/>`,
  c=>`${NECK}<rect class="ol ant" x="92" y="10" width="16" height="16" rx="4" fill="#9aa5b8"/><path class="ol" d="M64 24H136L158 92H42Z" fill="${c}"/><rect class="ol" x="58" y="42" width="84" height="26" rx="13" fill="#2d1b4e"/><circle class="eye2" cx="82" cy="55" r="7"/><circle class="eye2" cx="118" cy="55" r="7"/><path class="ol" d="M84 80H116"/>`
 ],
 body:[
  c=>`${ARMS(c)}<rect class="ol" x="40" y="2" width="120" height="96" rx="18" fill="${c}"/><rect class="ol" x="64" y="18" width="72" height="54" rx="10" fill="#2d1b4e"/><path class="hrt" d="M100 62C80 48 84 30 95 32C98 33 100 37 100 40C100 37 102 33 105 32C116 30 120 48 100 62Z" fill="#ff5d8f"/><circle class="ol" cx="100" cy="86" r="5" fill="#fff"/>`,
  c=>`${ARMS(c)}<ellipse class="ol" cx="100" cy="50" rx="64" ry="48" fill="${c}"/><circle class="ol ant" cx="76" cy="46" r="9" fill="#ff5d5d"/><circle class="ol ant" cx="100" cy="46" r="9" fill="#ffd23f"/><circle class="ol ant" cx="124" cy="46" r="9" fill="#6bd96b"/><path class="ol" d="M74 74H126"/>`,
  c=>`${ARMS(c)}<path class="ol" d="M42 2H158L134 98H66Z" fill="${c}"/><path class="ol hrt" d="M100 20L107 37L125 38L111 49L116 67L100 57L84 67L89 49L75 38L93 37Z" fill="#fff"/>`
 ],
 legs:[
  c=>`<rect class="ol" x="66" y="-4" width="24" height="60" rx="8" fill="#9aa5b8"/><rect class="ol" x="110" y="-4" width="24" height="60" rx="8" fill="#9aa5b8"/><rect class="ol" x="50" y="52" width="46" height="28" rx="13" fill="${c}"/><rect class="ol" x="104" y="52" width="46" height="28" rx="13" fill="${c}"/>`,
  c=>`<rect class="ol" x="86" y="-4" width="28" height="40" rx="6" fill="#9aa5b8"/><g class="wheel"><circle class="ol" cx="100" cy="56" r="30" fill="${c}"/><path class="ol" d="M100 30V82M74 56H126"/><circle class="ol" cx="100" cy="56" r="9" fill="#fff"/></g>`,
  c=>`<polyline class="ol" style="stroke-width:7" fill="none" points="78,-4 64,8 92,20 64,32 92,44 64,56 78,62"/><polyline class="ol" style="stroke-width:7" fill="none" points="122,-4 108,8 136,20 108,32 136,44 108,56 122,62"/><ellipse class="ol" cx="74" cy="72" rx="26" ry="12" fill="${c}"/><ellipse class="ol" cx="126" cy="72" rx="26" ry="12" fill="${c}"/>`
 ]
};
const svgPart=(cat,p)=>`<svg viewBox="${VB[cat]}">${DRAW[cat][p.s](PC[p.c])}</svg>`;
const ghost=cat=>`<svg viewBox="${VB[cat]}"><rect x="44" y="${cat==='head'?18:6}" width="112" height="${cat==='legs'?74:78}" rx="18" fill="rgba(255,255,255,.6)" stroke="#2d1b4e" stroke-width="4" stroke-dasharray="12 9"/><text x="100" y="${cat==='legs'?58:66}" text-anchor="middle" font-size="42" fill="#2d1b4e" opacity=".45" font-family="Lilita One,Comic Sans MS,sans-serif">?</text></svg>`;

/*FALAS*/
const F={
 intro:L('Monte um robô igualzinho ao modelo!','Build a robot just like the model!'),
 again:L('Um robô novo! Olhe o modelo!','A new robot! Look at the model!'),
 say:L('Arraste as peças da esteira e monte um robô igualzinho ao modelo!','Drag the pieces from the belt and build a robot just like the model!'),
 good:L(['Isso!','Encaixou!','Muito bem!'],['Yes!','It fits!','Great job!']),
 color:L('Quase! A forma é igual, mas a cor é diferente!','Almost! The shape is the same, but the color is different!'),
 wrong:L('Ops! Essa peça não é igual ao modelo!',"Oops! That piece doesn't match the model!"),
 alive:L(['Bip bop! Obrigado por me montar!','Bip bip! Eu ganhei vida!','Bop bop! Vamos dançar!'],['Beep boop! Thanks for building me!',"Beep beep! I'm alive!","Boop boop! Let's dance!"]),
 end:L('Parabéns! Você é um engenheiro de robôs!','Congratulations! You are a robot engineer!')
};
function falas(){return [F.intro,F.again,F.say,F.color,F.wrong,F.end,...F.good,...F.alive.map(t=>[t,'robo'])]}
/*FIM-FALAS*/
/* ---------- jogo ---------- */
const ROUNDS=6;let round=0,model,placed,busy=false,R;
$('stars').innerHTML='<span>⭐</span>'.repeat(ROUNDS);
$('go').onclick=()=>{$('start').classList.remove('show');startGame()};
$('again').onclick=()=>{$('end').classList.remove('show');startGame()};
$('say').onclick=()=>speak(F.say);
const same=(a,b)=>a.s===b.s&&a.c===b.c;

function startGame(){round=0;document.querySelectorAll('#stars span').forEach(s=>s.classList.remove('on'));next()}
function next(){
 if(round>=ROUNDS){confetti(220);speak(F.end);$('end').classList.add('show');return}
 busy=false;placed={};$('robot').classList.remove('alive');
 model={};CATS.forEach(c=>model[c]={s:rnd(3),c:rnd(6)});
 const parts=[];
 CATS.forEach(cat=>{const m=model[cat];parts.push({cat,...m});
  const extra=round>=4?2:1;const used=[m];
  for(let k=0;k<extra;k++){let d;do{d=(round>=2&&Math.random()<.5)?{s:m.s,c:rnd(6)}:{s:(m.s+1+rnd(2))%3,c:rnd(6)}}while(used.some(u=>same(u,d)));used.push(d);parts.push({cat,...d})}});
 layout(parts.length);
 $('model').innerHTML=CATS.map(cat=>`<div style="width:${R*.55}px;height:${R*.55*RATIO[cat]}px">${svgPart(cat,model[cat])}</div>`).join('');
 $('robot').innerHTML=CATS.map(cat=>`<div class="slot" data-cat="${cat}" style="width:${R}px;height:${R*RATIO[cat]}px">${ghost(cat)}</div>`).join('');
 const belt=$('belt');belt.innerHTML='';
 shuffle(parts).forEach((p,i)=>{const el=document.createElement('div');el.className='part';el.style.width=P+'px';el.style.height=P*.66+'px';el.style.animationDelay=(i*.07)+'s';el.innerHTML=svgPart(p.cat,p);belt.appendChild(el);bind(el,p)});
 speak.preload(F.good.concat([F.color,F.wrong],F.alive.map(t=>[t,'robo'])));
 setTimeout(()=>speak(round===0?F.intro:F.again),300);
}
let P;
function layout(n){const W=innerWidth,H=innerHeight;
 const perRow=W<640?Math.ceil(n/2):n;P=Math.min((W-40-(perRow-1)*12)/perRow-10,120);
 const beltH=Math.ceil(n/perRow)*(P*.66+28)+40;
 R=Math.min((W-60)*.55,(H-80-beltH-70)/1.45,300)}
function bind(el,p){let sx,sy,c0,drag=false;const rob=$('robot');
 const inside=(x,y)=>{const r=$('bay').getBoundingClientRect();return x>r.left&&x<r.right&&y>r.top&&y<r.bottom};
 el.addEventListener('pointerdown',e=>{if(busy||el.classList.contains('gone'))return;e.preventDefault();drag=true;el.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;const r=el.getBoundingClientRect();c0={x:r.left+r.width/2,y:r.top+r.height/2};el.classList.add('drag');tone(420,.1,'square',.1,0,700)});
 el.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-sx,dy=e.clientY-sy;el.style.transform=`translate(${dx}px,${dy}px) scale(1.15)`;rob.classList.toggle('over',inside(c0.x+dx,c0.y+dy))});
 const end=e=>{if(!drag)return;drag=false;el.classList.remove('drag');rob.classList.remove('over');el.style.transform='';
  if(e.type!=='pointerup'||!inside(c0.x+e.clientX-sx,c0.y+e.clientY-sy))return;
  if(same(p,model[p.cat])&&!placed[p.cat]){placed[p.cat]=1;el.classList.add('gone');const slot=rob.querySelector(`[data-cat="${p.cat}"]`);slot.innerHTML=svgPart(p.cat,p);slot.classList.remove('snap');void slot.offsetWidth;slot.classList.add('snap');
   tone(180,.08,'square',.2);tone(900,.12,'triangle',.2,.08);bolts(slot);
   if(Object.keys(placed).length===3)alive();else speak(F.good[rnd(3)])}
  else{const b=$('bay');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');tone(220,.3,'sawtooth',.1,0,110);
   const m=model[p.cat];speak(p.s===m.s?F.color:F.wrong)}};
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
function bolts(slot){const r=slot.getBoundingClientRect();for(let i=0;i<4;i++){const b=document.createElement('div');b.className='bolt';b.textContent=['🔩','⚙️','✨'][rnd(3)];b.style.left=r.left+r.width/2+'px';b.style.top=r.top+r.height/2+'px';b.style.setProperty('--dx',(Math.random()-.5)*220+'px');b.style.setProperty('--dy',(Math.random()-.5)*160+'px');document.body.appendChild(b);setTimeout(()=>b.remove(),700)}}
function alive(){busy=true;setTimeout(()=>{$('robot').classList.add('alive');
 for(let i=0;i<10;i++)tone(300+rnd(900),.09,'square',.08,i*.1);
 setTimeout(()=>speak(F.alive[rnd(3)],'robo'),900);
 confetti();document.querySelectorAll('#stars span')[round].classList.add('on');round++;setTimeout(next,4200)},300)}

</script>
</body>
</html>
