<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6ec6ff">
<title data-en="Hungry Monster">Monstrinho Comilão</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--ol:#2d1b4e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{font-family:'Lilita One','Comic Sans MS','Chalkboard SE',cursive;background:linear-gradient(#6ec6ff,#b8e6ff 70%);color:var(--ol);letter-spacing:.5px}
/* cenário */
.sun{position:fixed;top:78px;right:22px;width:78px;height:78px;border-radius:50%;background:#ffd93b;border:6px solid var(--ol);box-shadow:0 0 0 14px rgba(255,217,59,.35);animation:spin 12s linear infinite}
.sun::before,.sun::after{content:'';position:absolute;width:10px;height:10px;border-radius:50%;background:var(--ol);top:24px;left:16px;box-shadow:28px 0 0 var(--ol)}
.sun::after{width:26px;height:12px;border-radius:0 0 20px 20px;background:none;border:5px solid var(--ol);border-top:none;top:38px;left:20px;box-shadow:none}
@keyframes spin{50%{transform:rotate(12deg) scale(1.05)}}
.cloud{position:fixed;width:130px;animation:drift 30s linear infinite}
.cloud.c2{width:90px;animation-duration:44s;animation-delay:-20s}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(110vw)}}
.grass{position:fixed;left:-15%;right:-15%;bottom:-60px;height:calc(26% + 60px);background:#7ed957;border:7px solid var(--ol);border-radius:50% 50% 0 0/40px 40px 0 0}
.grass::after{content:'';position:absolute;left:10%;right:10%;top:18px;height:14px;border-radius:10px;background:rgba(255,255,255,.25)}
/* layout */
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;z-index:20;gap:8px}
.btn{border:5px solid var(--ol);background:#fff;border-radius:18px;font-size:26px;width:58px;height:58px;flex:none;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 5px 0 var(--ol);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ol)}
#stars{display:flex;gap:2px;font-size:clamp(18px,4.5vw,30px);background:#fff;border:5px solid var(--ol);box-shadow:0 5px 0 var(--ol);padding:4px 10px;border-radius:20px}
#stars span{filter:grayscale(1);opacity:.3;transition:.4s}
#stars span.on{filter:none;opacity:1;animation:boing .5s}
main{position:fixed;inset:0;padding:80px 12px 16px;display:flex;flex-direction:column;align-items:center;z-index:5}
.bubble{position:relative;background:#fff;border:6px solid var(--ol);border-radius:28px;padding:10px 22px;font-size:clamp(22px,5.4vw,38px);box-shadow:0 7px 0 var(--ol);text-align:center;animation:boing .5s;cursor:pointer;max-width:94vw}
.bubble::after{content:'';position:absolute;left:50%;bottom:-26px;width:30px;height:30px;background:#fff;border-right:6px solid var(--ol);border-bottom:6px solid var(--ol);transform:translateX(-50%) rotate(45deg);border-radius:0 0 8px 0}
.pill{display:inline-block;color:#fff;padding:0 14px;border-radius:16px;border:5px solid var(--ol);text-shadow:2px 2px 0 var(--ol),-2px -2px 0 var(--ol),2px -2px 0 var(--ol),-2px 2px 0 var(--ol);margin:0 4px}
#mwrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding-top:22px}
#monster{height:100%;max-width:92vw;aspect-ratio:1;overflow:visible;cursor:pointer}
#plates{display:flex;justify-content:center;gap:clamp(8px,3vw,24px);padding-bottom:6px}
.plate{width:var(--p);height:var(--p);border-radius:50%;background:#fff;border:6px solid var(--ol);box-shadow:0 7px 0 var(--ol),inset 0 0 0 calc(var(--p)*.07) #ffe0ef;display:flex;align-items:center;justify-content:center;position:relative;animation:boing .5s backwards}
.food{font-size:calc(var(--p)*.6);line-height:1;touch-action:none;cursor:grab;position:relative;z-index:1;filter:drop-shadow(0 4px 0 rgba(45,27,78,.35))}
.food.drag{z-index:50;filter:drop-shadow(0 12px 6px rgba(45,27,78,.35))}
@keyframes boing{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
/* monstro */
.ol{stroke:var(--ol);stroke-width:7;stroke-linejoin:round;stroke-linecap:round}
.skin{fill:var(--skin,#4cc9f0);transition:fill .7s}
#mbody{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.03,.97)}}
#eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
#armR{transform-box:fill-box;transform-origin:20% 90%}
.chomp #mbody{animation:chomp .22s 4}
@keyframes chomp{50%{transform:scale(1.1,.88)}}
.happy #armR{animation:wave .3s 4 alternate}
@keyframes wave{to{transform:rotate(-35deg)}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-14px) rotate(-5deg)}40%{transform:translateX(12px) rotate(5deg)}60%{transform:translateX(-8px)}80%{transform:translateX(6px)}}
.wiggle{animation:wiggle .5s}
@keyframes wiggle{25%{transform:rotate(-6deg) scale(1.05)}75%{transform:rotate(6deg) scale(1.05)}}
.dance{animation:dance .6s ease-in-out infinite}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-30px) rotate(8deg)}}
.crumb{position:fixed;font-size:26px;pointer-events:none;z-index:60;animation:crumb .8s forwards}
@keyframes crumb{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
/* telas */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(45,27,78,.45);z-index:80;padding:16px}
.overlay.show{display:flex}
.box{background:#fff;border:7px solid var(--ol);border-radius:36px;padding:26px 22px;text-align:center;max-width:480px;width:100%;box-shadow:0 12px 0 var(--ol);animation:boing .5s}
.box .big{font-size:92px;line-height:1;animation:dance 1.2s ease-in-out infinite}
.box h2{font-size:clamp(30px,7vw,44px);color:#ff5d8f;margin:12px 0;text-shadow:3px 3px 0 var(--ol)}
.box p{font-size:22px;margin-bottom:18px}
.play{border:6px solid var(--ol);border-radius:24px;background:#8ac926;color:#fff;font-family:inherit;font-size:32px;padding:10px 36px;box-shadow:0 7px 0 var(--ol);cursor:pointer;text-shadow:2px 2px 0 var(--ol)}
.play:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ol)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
</style>
</head>
<body>
<div class="sun"></div>
<svg class="cloud" style="top:120px" viewBox="0 0 130 70"><path class="ol" fill="#fff" stroke-width="5" d="M25 62a20 20 0 0 1 2-38a26 26 0 0 1 48-8a22 22 0 0 1 36 18a16 16 0 0 1 -4 28z"/></svg>
<svg class="cloud c2" style="top:200px" viewBox="0 0 130 70"><path class="ol" fill="#fff" stroke-width="6" d="M25 62a20 20 0 0 1 2-38a26 26 0 0 1 48-8a22 22 0 0 1 36 18a16 16 0 0 1 -4 28z"/></svg>
<div class="grass"></div>

<div class="top"><a class="btn" href="../index.html">🏠</a><div id="stars"></div><button class="btn" id="say">🔊</button></div>

<main>
  <div class="bubble" id="bubble" data-en="Hi! I'm Bolota!">Oi! Eu sou o Bolota!</div>
  <div id="mwrap">
  <svg id="monster" viewBox="0 0 300 300">
    <ellipse cx="150" cy="290" rx="100" ry="10" fill="rgba(45,27,78,.18)"/>
    <g id="mbody">
      <ellipse class="ol skin" cx="105" cy="274" rx="34" ry="16"/>
      <ellipse class="ol skin" cx="195" cy="274" rx="34" ry="16"/>
      <path class="ol" fill="#ffd54f" d="M98 78 Q78 20 116 36 Q120 58 122 72Z"/>
      <path class="ol" fill="#ffd54f" d="M202 78 Q222 20 184 36 Q180 58 178 72Z"/>
      <ellipse class="ol skin" cx="40" cy="185" rx="18" ry="32" transform="rotate(28 40 185)"/>
      <g id="armR"><ellipse class="ol skin" cx="260" cy="185" rx="18" ry="32" transform="rotate(-28 260 185)"/></g>
      <path class="ol skin" stroke-width="8" d="M150 52C240 52 266 130 261 192C256 252 210 276 150 276C90 276 44 252 39 192C34 130 60 52 150 52Z"/>
      <ellipse cx="150" cy="226" rx="72" ry="44" fill="rgba(255,255,255,.35)"/>
      <circle cx="80" cy="110" r="9" fill="rgba(45,27,78,.12)"/><circle cx="222" cy="100" r="7" fill="rgba(45,27,78,.12)"/><circle cx="232" cy="128" r="5" fill="rgba(45,27,78,.12)"/>
      <ellipse cx="82" cy="170" rx="15" ry="9" fill="#ff8aa8" opacity=".8"/>
      <ellipse cx="218" cy="170" rx="15" ry="9" fill="#ff8aa8" opacity=".8"/>
      <g id="eyes">
        <circle class="ol" fill="#fff" cx="112" cy="125" r="32"/>
        <circle class="ol" fill="#fff" cx="188" cy="125" r="32"/>
        <g id="pL"><circle cx="112" cy="125" r="15" fill="#2d1b4e"/><circle cx="106" cy="119" r="5" fill="#fff"/></g>
        <g id="pR"><circle cx="188" cy="125" r="15" fill="#2d1b4e"/><circle cx="182" cy="119" r="5" fill="#fff"/></g>
      </g>
      <g id="mSmile"><path class="ol" fill="#7a1f3d" d="M112 180 Q150 232 188 180 Q150 196 112 180Z"/><path fill="#fff" d="M126 186 l8 0 l-4 9z M166 186 l8 0 l-4 9z"/></g>
      <g id="mOpen" style="display:none">
        <ellipse class="ol" fill="#7a1f3d" cx="150" cy="200" rx="46" ry="38"/>
        <ellipse fill="#ff7aa2" cx="150" cy="222" rx="26" ry="13"/>
        <path class="ol" fill="#fff" stroke-width="4" d="M124 168 l12 0 l-6 13z M164 168 l12 0 l-6 13z"/>
      </g>
      <g id="mYuck" style="display:none">
        <path class="ol" fill="none" d="M108 196 q10 -14 21 0 t21 0 t21 0 t21 0"/>
        <path class="ol" fill="#ff7aa2" stroke-width="5" d="M150 198 q0 26 14 22 q10 -4 2 -22"/>
      </g>
    </g>
  </svg>
  </div>
  <div id="plates"></div>
</main>

<div id="start" class="overlay show"><div class="box"><div class="big">👾</div><h2 data-en="Hungry Monster">Monstrinho Comilão</h2><p data-en="Bolota is hungry!<br>Give him food in the color he asks for.">O Bolota está com fome!<br>Dê a comida da cor que ele pedir.</p><button class="play" id="go" data-en="▶ PLAY">▶ JOGAR</button><br><button class="lang-toggle"></button></div></div>
<div id="end" class="overlay"><div class="box"><div class="big">🎉</div><h2 data-en="Tummy full!">Barriga cheia!</h2><p data-en="Bolota loved it! Thank you! 💖">O Bolota amou! Obrigado! 💖</p><button class="play" id="again" data-en="🔄 AGAIN">🔄 DE NOVO</button></div></div>

<script src="../comum/voz.js"></script>
<script>
const AC=window.AudioContext||window.webkitAudioContext;let ac;
function tone(f,d=.15,type='sine',vol=.25,delay=0,f2){try{ac=ac||new AC();if(ac.state==='suspended')ac.resume();const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
const sfx={
 pick(){tone(500,.12,'triangle',.25,0,800)},
 chomp(){for(let i=0;i<4;i++){tone(180,.09,'square',.12,i*.22,90);tone(120,.07,'sawtooth',.08,i*.22+.05)}},
 yum(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.25,1+i*.09))},
 yuck(){tone(300,.4,'sawtooth',.12,0,120)},
 giggle(){[700,900,750,1000,800,1100].forEach((f,i)=>tone(f,.07,'triangle',.2,i*.07))},
 win(){[523,659,784,659,784,1047,1319].forEach((f,i)=>tone(f,.22,'square',.1,i*.13))}
};
function confetti(n=160){const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);const W=c.width=innerWidth,H=c.height=innerHeight,x=c.getContext('2d'),cl=['#ff5d8f','#ffd23f','#3bceac','#5e60ce','#ff8c42','#4cc9f0'];const ps=Array.from({length:n},()=>({x:W/2,y:H*.4,vx:(Math.random()-.5)*18,vy:-Math.random()*15-4,s:Math.random()*9+8,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cl[Math.random()*cl.length|0]}));let f=0;(function L(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.strokeStyle='#2d1b4e';x.lineWidth=2;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.strokeRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<170)requestAnimationFrame(L);else c.remove()})()}

/*FALAS*/
const COLORS=[
 {id:L('vermelha','red'),hex:'#ff4d4d',foods:['🍎','🍓','🍒','🍅']},
 {id:L('amarela','yellow'),hex:'#ffc914',foods:['🍌','🍋','🌽','🧀']},
 {id:L('verde','green'),hex:'#5ccf5c',foods:['🥦','🥝','🍏','🥒','🥑']},
 {id:L('laranja','orange'),hex:'#ff9433',foods:['🥕','🍊']},
 {id:L('roxa','purple'),hex:'#a66cff',foods:['🍇','🍆']},
 {id:L('marrom','brown'),hex:'#b07a4f',foods:['🍪','🥔','🥥']},
];
const F={
 ask:c=>L(`Quero uma comida ${c.id}!`,`I want something ${c.id}!`),
 yuck:c=>L(`Eca! Essa não! Eu quero comida ${c.id}!`,`Yuck! Not that one! I want something ${c.id}!`),
 bubble:c=>{const p=`<span class="pill" style="background:${c.hex}">${c.id.toUpperCase()}</span>`;return L(`Quero comida ${p}!`,`I want ${p} food!`)},
 tap:L(['Hihihi!','Faz cócegas!','Estou com fome!','Nham?'],['Hee hee!','That tickles!',"I'm hungry!",'Yum?']),
 yum:L(['Nham nham! Que delícia!','Hummm! Gostoso!','Obrigado! Adorei!','Iupi! Que gostoso!'],['Yum yum! Delicious!','Mmm! Tasty!','Thank you! I loved it!','Yippee! So yummy!']),
 fin:L('Uhuuu! Minha barriga está cheia! Obrigado, amigo!','Woohoo! My tummy is full! Thank you, friend!')
};
function falas(){return [...COLORS.flatMap(c=>[F.ask(c),F.yuck(c)]),...F.tap,...F.yum,F.fin].map(t=>[t,'monstro'])}
/*FIM-FALAS*/
const ROUNDS=8;let round=0,target,busy=false,lastTarget;
const $=id=>document.getElementById(id);
const svg=$('monster'),mbody=$('mbody'),bubble=$('bubble');
$('stars').innerHTML='<span>⭐</span>'.repeat(ROUNDS);
$('go').onclick=()=>{$('start').classList.remove('show');startGame()};
$('again').onclick=()=>{$('end').classList.remove('show');svg.classList.remove('dance');startGame()};
const askText=()=>F.ask(target);
$('say').onclick=bubble.onclick=()=>target&&speak(askText(),'monstro');

/* geometria do monstro na tela */
function geo(){const r=svg.getBoundingClientRect(),s=Math.min(r.width,r.height)/300;return{s,ox:r.left+(r.width-300*s)/2,oy:r.top+(r.height-300*s)/2}}
function pt(x,y){const g=geo();return{x:g.ox+x*g.s,y:g.oy+y*g.s,s:g.s}}
function lookAt(cx,cy){[['pL',112],['pR',188]].forEach(([id,ex])=>{const e=pt(ex,125),dx=cx-e.x,dy=cy-e.y,d=Math.hypot(dx,dy)||1,m=Math.min(13,d/e.s/8);$(id).setAttribute('transform',`translate(${dx/d*m} ${dy/d*m})`)})}
addEventListener('pointermove',e=>lookAt(e.clientX,e.clientY));
function mouth(m){$('mSmile').style.display=m==='smile'?'':'none';$('mOpen').style.display=m==='open'?'':'none';$('mYuck').style.display=m==='yuck'?'':'none'}
function anim(el,cls){el.classList.remove(cls);void el.getBoundingClientRect();el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),1000)}

svg.addEventListener('pointerdown',()=>{if(busy)return;sfx.giggle();anim(svg,'wiggle');speak(pick(F.tap),'monstro')});

function startGame(){round=0;busy=false;svg.style.setProperty('--skin','#4cc9f0');document.querySelectorAll('#stars span').forEach(s=>s.classList.remove('on'));next()}
const pick=a=>a[Math.random()*a.length|0];
function next(){
 if(round>=ROUNDS){finale();return}
 busy=false;mouth('smile');
 do{target=pick(COLORS)}while(target===lastTarget);lastTarget=target;
 bubble.innerHTML=F.bubble(target);
bubble.style.animation='none';void bubble.offsetWidth;bubble.style.animation='';
 const others=COLORS.filter(c=>c!==target).sort(()=>Math.random()-.5).slice(0,3);
 const items=[{e:pick(target.foods),c:target},...others.map(c=>({e:pick(c.foods),c}))].sort(()=>Math.random()-.5);
 const P=Math.min((innerWidth-24)/4.6,innerHeight*.15,130);
 const pl=$('plates');pl.innerHTML='';pl.style.setProperty('--p',P+'px');
 items.forEach((it,i)=>{const p=document.createElement('div');p.className='plate';p.style.animationDelay=(i*.08)+'s';const f=document.createElement('div');f.className='food';f.textContent=it.e;p.appendChild(f);pl.appendChild(p);bindFood(f,it)});
 speak.preload([[askText(),'monstro'],[F.yuck(target),'monstro']].concat(F.yum.map(t=>[t,'monstro'])));
 setTimeout(()=>speak(askText(),'monstro'),300);
}
function bindFood(el,it){let sx,sy,c0,drag=false;
 const near=(dx,dy)=>{const m=pt(150,200);return Math.hypot(c0.x+dx-m.x,c0.y+dy-m.y)<95*m.s};
 el.addEventListener('pointerdown',e=>{if(busy)return;e.preventDefault();drag=true;el.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;const r=el.getBoundingClientRect();c0={x:r.left+r.width/2,y:r.top+r.height/2};el.style.transition='none';el.classList.add('drag');el.parentNode.style.zIndex=40;sfx.pick()});
 el.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-sx,dy=e.clientY-sy;el.style.transform=`translate(${dx}px,${dy}px) scale(1.2)`;mouth(near(dx,dy)?'open':'smile')});
 const end=e=>{if(!drag)return;drag=false;el.classList.remove('drag');const dx=e.clientX-sx,dy=e.clientY-sy;
  if(e.type==='pointerup'&&near(dx,dy)){if(it.c===target)eat(el,it);else yuck(el)}else back(el)};
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
 function back(el){el.style.transition='transform .45s cubic-bezier(.3,1.6,.5,1)';el.style.transform='';mouth('smile');setTimeout(()=>el.parentNode&&(el.parentNode.style.zIndex=''),450)}
 function eat(el){busy=true;const m=pt(150,200);el.style.transition='transform .25s ease-in';el.style.transform=`translate(${m.x-c0.x}px,${m.y-c0.y}px) scale(.15)`;
  setTimeout(()=>{el.style.visibility='hidden';sfx.chomp();svg.classList.add('chomp');let k=0;const iv=setInterval(()=>{mouth(k++%2?'open':'smile');crumbs(m.x,m.y,it.e)},220);
   setTimeout(()=>{clearInterval(iv);svg.classList.remove('chomp');mouth('smile');svg.style.setProperty('--skin',target.hex);anim(svg,'happy');sfx.yum();
    speak(pick(F.yum),'monstro');
    document.querySelectorAll('#stars span')[round].classList.add('on');round++;setTimeout(next,1800)},900)},250)}
 function yuck(el){busy=true;mouth('yuck');sfx.yuck();anim(svg,'shake');speak(F.yuck(target),'monstro');back(el);setTimeout(()=>{mouth('smile');busy=false},1100)}
}
function crumbs(x,y,e){for(let i=0;i<2;i++){const c=document.createElement('div');c.className='crumb';c.textContent=Math.random()<.5?e:'✨';c.style.left=x+'px';c.style.top=y+'px';c.style.setProperty('--dx',(Math.random()-.5)*160+'px');c.style.setProperty('--dy',(Math.random()*-90-20)+'px');document.body.appendChild(c);setTimeout(()=>c.remove(),800)}}
function finale(){busy=true;$('plates').innerHTML='';bubble.innerHTML=L('Barriga cheia! 🎉','Tummy full! 🎉');svg.classList.add('dance');sfx.win();confetti();
 speak(F.fin,'monstro');
 let i=0;const iv=setInterval(()=>{svg.style.setProperty('--skin',COLORS[i++%COLORS.length].hex);if(i>12)clearInterval(iv)},300);
 setTimeout(()=>$('end').classList.add('show'),3200)}
</script>
</body>
</html>
