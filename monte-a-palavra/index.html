<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ff6fae">
<title data-en="Build the Word">Monte a Palavra</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--ol:#2d1b4e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{font-family:'Lilita One','Comic Sans MS','Chalkboard SE',cursive;color:var(--ol);letter-spacing:.5px;
 background:radial-gradient(circle,rgba(255,255,255,.28) 3px,transparent 4px) 0 0/34px 34px,linear-gradient(#ffa6cf,#ff6fae)}
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;z-index:20;gap:8px}
.top .r{display:flex;gap:8px}
.btn{border:5px solid var(--ol);background:#fff;border-radius:18px;font-size:26px;width:58px;height:58px;flex:none;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 5px 0 var(--ol);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ol)}
#stars{display:flex;gap:1px;font-size:clamp(13px,3.4vw,26px);background:#fff;border:5px solid var(--ol);box-shadow:0 5px 0 var(--ol);padding:4px 8px;border-radius:20px}
#stars span{filter:grayscale(1);opacity:.3;transition:.4s}
#stars span.on{filter:none;opacity:1;animation:boing .5s}
main{position:fixed;inset:0;padding:84px 12px 18px;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:10px}
#pic{width:min(44vw,28vh,230px);aspect-ratio:1;background:#fff;border:7px solid var(--ol);border-radius:36px;box-shadow:0 9px 0 var(--ol);display:flex;align-items:center;justify-content:center;font-size:min(30vw,19vh,160px);line-height:1;cursor:pointer;position:relative}
#pic span{display:block;animation:bob 2.4s ease-in-out infinite}
#pic.yay span{animation:dance .45s ease-in-out 4}
#pic::after{content:'?';position:absolute;top:-18px;right:-14px;width:46px;height:46px;border-radius:50%;background:#ffd23f;border:5px solid var(--ol);display:flex;align-items:center;justify-content:center;font-size:28px;transform:rotate(12deg)}
#pic.yay::after{content:'★';background:#8ac926;color:#fff}
#slots{display:flex;gap:8px;justify-content:center}
.slot{width:var(--s);height:calc(var(--s)*1.15);border:5px dashed var(--ol);border-radius:16px;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)*.7);color:rgba(45,27,78,.22);transition:background .2s}
.slot.next{border-color:#fff;background:rgba(255,255,255,.9);animation:pulse 1s ease-in-out infinite}
.slot.over{background:#fff;transform:scale(1.08)}
.slot.full{border-style:solid;border-color:var(--ol);background:var(--c);color:#fff;box-shadow:0 5px 0 var(--ol);text-shadow:2px 2px 0 var(--ol),-2px -2px 0 var(--ol),2px -2px 0 var(--ol),-2px 2px 0 var(--ol);animation:boing .4s}
#slots.wave .slot{animation:hop .4s ease-in-out}
#tray{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:660px;min-height:calc(var(--s) + 10px)}
.tile{width:var(--s);height:var(--s);border:5px solid var(--ol);border-radius:16px;background:#fff;box-shadow:0 6px 0 var(--ol);font-size:calc(var(--s)*.62);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;position:relative;transition:transform .4s cubic-bezier(.3,1.6,.5,1);animation:boing .45s backwards}
.tile.drag{z-index:50;transition:none;background:#fff8d6}
.tile.used{visibility:hidden}
.tile.glow{animation:glow .5s 5}
.tile.no{animation:shake .4s}
@keyframes glow{50%{background:#ffd23f;transform:scale(1.15)}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes hop{50%{transform:translateY(-30%)}}
@keyframes bob{50%{transform:translateY(-8px) rotate(-5deg)}}
@keyframes boing{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{20%{transform:translateX(-10px) rotate(-6deg)}40%{transform:translateX(9px) rotate(6deg)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-10deg)}50%{transform:translateY(-22px) rotate(10deg)}}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(45,27,78,.45);z-index:80;padding:16px}
.overlay.show{display:flex}
.box{background:#fff;border:7px solid var(--ol);border-radius:36px;padding:26px 22px;text-align:center;max-width:480px;width:100%;box-shadow:0 12px 0 var(--ol);animation:boing .5s}
.box .big{font-size:92px;line-height:1;animation:dance 1.2s ease-in-out infinite}
.box h2{font-size:clamp(30px,7vw,44px);color:#ff6fae;margin:12px 0;text-shadow:3px 3px 0 var(--ol)}
.box p{font-size:22px;margin-bottom:18px}
.play{border:6px solid var(--ol);border-radius:24px;background:#8ac926;color:#fff;font-family:inherit;font-size:32px;padding:10px 36px;box-shadow:0 7px 0 var(--ol);cursor:pointer;text-shadow:2px 2px 0 var(--ol)}
.play:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ol)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
</style>
</head>
<body>
<div class="top"><a class="btn" href="../index.html">🏠</a><div id="stars"></div><div class="r"><button class="btn" id="hintBtn">💡</button><button class="btn" id="say">🔊</button></div></div>
<main>
  <div id="pic"><span></span></div>
  <div id="slots"></div>
  <div id="tray"></div>
</main>
<div id="start" class="overlay show"><div class="box"><div class="big">🔤</div><h2 data-en="Build the Word">Monte a Palavra</h2><p data-en="Look at the picture and build its name with the letters!">Olhe a figura e monte o nome dela com as letras!</p><button class="play" id="go" data-en="▶ PLAY">▶ JOGAR</button><br><button class="lang-toggle"></button></div></div>
<div id="end" class="overlay"><div class="box"><div class="big">🏆</div><h2 data-en="Word Master!">Mestre das Palavras!</h2><p data-en="You built all the words! 📚">Você montou todas as palavras! 📚</p><button class="play" id="again" data-en="🔄 AGAIN">🔄 DE NOVO</button></div></div>

<script src="../comum/voz.js"></script>
<script>
const AC=window.AudioContext||window.webkitAudioContext;let ac;
function tone(f,d=.15,type='sine',vol=.25,delay=0,f2){try{ac=ac||new AC();if(ac.state==='suspended')ac.resume();const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
function confetti(n=160){const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);const W=c.width=innerWidth,H=c.height=innerHeight,x=c.getContext('2d'),cl=['#ff5d8f','#ffd23f','#3bceac','#5e60ce','#ff8c42','#4cc9f0'];const ps=Array.from({length:n},()=>({x:W/2,y:H*.4,vx:(Math.random()-.5)*18,vy:-Math.random()*15-4,s:Math.random()*9+8,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cl[Math.random()*cl.length|0]}));let f=0;(function Lp(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.strokeStyle='#2d1b4e';x.lineWidth=2;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.strokeRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<170)requestAnimationFrame(Lp);else c.remove()})()}
const $=id=>document.getElementById(id);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];

/*FALAS*/
const WORDS=L([
 ['SOL','☀️'],['LUA','🌙'],['UVA','🍇'],['OVO','🥚'],['GATO','🐱'],['PATO','🦆'],['BOLA','⚽'],['CASA','🏠'],['SAPO','🐸'],['RATO','🐭'],
 ['VACA','🐮'],['DADO','🎲'],['FOCA','🦭'],['LOBO','🐺'],['URSO','🐻'],['BOLO','🎂'],['MEIA','🧦'],['CAMA','🛏️'],['FLOR','🌸'],['TREM','🚂'],
 ['MOTO','🏍️'],['BOTA','👢'],['PEIXE','🐟'],['ZEBRA','🦓'],['PORCO','🐷'],['CHAVE','🔑'],['LIVRO','📖'],['CARRO','🚗'],['BARCO','⛵'],
 ['PIZZA','🍕'],['LEITE','🥛'],['MILHO','🌽'],['COELHO','🐰'],['MACACO','🐵'],['BANANA','🍌'],['CAVALO','🐴'],['GIRAFA','🦒'],['TOMATE','🍅'],['FOGUETE','🚀']
],[
 ['CAT','🐱'],['DOG','🐶'],['SUN','☀️'],['PIG','🐷'],['BUS','🚌'],['CAR','🚗'],['EGG','🥚'],['HAT','🎩'],['BEE','🐝'],['COW','🐮'],
 ['OWL','🦉'],['FOX','🦊'],['KEY','🔑'],['BED','🛏️'],['FISH','🐟'],['FROG','🐸'],['DUCK','🦆'],['BEAR','🐻'],['CAKE','🎂'],['BALL','⚽'],
 ['MOON','🌙'],['STAR','⭐'],['BOOK','📖'],['BOAT','⛵'],['TREE','🌳'],['LION','🦁'],['SHOE','👟'],['APPLE','🍎'],['ZEBRA','🦓'],
 ['HORSE','🐴'],['PIZZA','🍕'],['TIGER','🐯'],['HOUSE','🏠'],['TRAIN','🚂'],['ROBOT','🤖'],['MONKEY','🐵'],['RABBIT','🐰'],['BANANA','🍌'],['ROCKET','🚀']
]);
const LETRAS=L(
 Object.fromEntries([...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].map(c=>[c,c])),
 {A:'ay',B:'bee',C:'see',D:'dee',E:'ee',F:'eff',G:'gee',H:'aitch',I:'eye',J:'jay',K:'kay',L:'el',M:'em',N:'en',O:'oh',P:'pee',Q:'cue',R:'ar',S:'ess',T:'tee',U:'you',V:'vee',W:'double you',X:'ex',Y:'why',Z:'zee'}
);
const cap=w=>w[0]+w.slice(1).toLowerCase();
const F={
 start:L('Que figura é essa? Monte a palavra!','What is this picture? Build the word!'),
 next:L('E essa figura, o que é?','And what is this one?'),
 word:w=>cap(w),
 ok:w=>L(`${cap(w)}! Muito bem!`,`${cap(w)}! Great job!`),
 no:L('Ops! Essa letra não vai aí.',"Oops! That letter doesn't go there."),
 end:L('Parabéns! Você montou todas as palavras!','Congratulations! You built all the words!'),
 letter:c=>LETRAS[c]
};
function falas(){const a=[F.start,F.next,F.no,F.end];WORDS.forEach(([w])=>a.push(F.word(w),F.ok(w)));Object.values(LETRAS).forEach(v=>a.push(v));return a}
/*FIM-FALAS*/

const COL=['#ff5d5d','#ff9f43','#ffd23f','#6bd96b','#4cc9f0','#b07cff','#ff6fae'];
const ROUNDS=10;let round=0,used,word,filled,busy=true,tiles;
$('stars').innerHTML='<span>⭐</span>'.repeat(ROUNDS);
$('go').onclick=()=>{$('start').classList.remove('show');startGame()};
$('again').onclick=()=>{$('end').classList.remove('show');startGame()};
$('say').onclick=$('pic').onclick=()=>{if(!busy)speak(F.next)};
$('hintBtn').onclick=hint;

function startGame(){round=0;used=new Set();document.querySelectorAll('#stars span').forEach(s=>s.classList.remove('on'));next()}
function next(){
 if(round>=ROUNDS){confetti(220);[523,659,784,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.25,i*.12));speak(F.end);$('end').classList.add('show');return}
 busy=false;
 const lenOk=round<4?(n=>n<=4):round<7?(n=>n===5):(n=>n>=5);
 let pool=WORDS.filter(([w])=>lenOk(w.length)&&!used.has(w));if(!pool.length)pool=WORDS.filter(([w])=>!used.has(w));
 const [w,e]=pick(pool);used.add(w);word=w;
 const ghost=round<4,extra=round>=7?2:round>=4?1:0;
 const letters=[...w];
 const ABC='ABCDEFGHIJLMNOPRSTUVZ';
 for(let k=0;k<extra;k++){let c;do{c=ABC[Math.random()*ABC.length|0]}while(w.includes(c)||letters.includes(c));letters.push(c)}
 do{shuffle(letters)}while(letters.slice(0,w.length).join('')===w&&w.length>2);
 const n=w.length,S=Math.floor(Math.min(80,(innerWidth-28-(n-1)*8)/n));
 document.documentElement.style.setProperty('--s',S+'px');
 const pic=$('pic');pic.classList.remove('yay');pic.querySelector('span').textContent=e;
 pic.style.animation='none';void pic.offsetWidth;pic.style.animation='boing .5s';
 filled=Array(n).fill(false);
 $('slots').classList.remove('wave');
 $('slots').innerHTML=[...w].map((c,i)=>`<div class="slot" data-i="${i}">${ghost?c:''}</div>`).join('');
 const tray=$('tray');tray.innerHTML='';
 tiles=letters.map((c,i)=>{const t=document.createElement('div');t.className='tile';t.textContent=c;t.style.animationDelay=(.2+i*.06)+'s';tray.appendChild(t);bind(t,c);return t});
 markNext();
 speak.preload([F.ok(w),F.word(w),F.no].concat([...new Set(letters)].map(F.letter)));
 setTimeout(()=>speak(round===0?F.start:F.next),400);
}
function slots(){return[...document.querySelectorAll('.slot')]}
function markNext(){const i=filled.indexOf(false);slots().forEach((s,k)=>s.classList.toggle('next',k===i))}
function place(t,c,i){t.classList.add('used');t.style.transform='';const s=slots()[i];s.textContent=c;s.style.setProperty('--c',COL[i%COL.length]);s.classList.add('full');s.classList.remove('next','over');filled[i]=true;
 tone(500+i*90,.12,'triangle',.25);markNext();if(!filled.includes(false))win()}
function wrong(t){t.style.transform='';t.classList.remove('no');void t.offsetWidth;t.classList.add('no');tone(260,.25,'sawtooth',.1,0,130);setTimeout(()=>speak(F.no),250)}
function slotAt(x,y){return slots().find(s=>{const r=s.getBoundingClientRect(),m=10;return x>r.left-m&&x<r.right+m&&y>r.top-m&&y<r.bottom+m})}
function bind(t,c){let sx,sy,c0,drag=false,moved=false,over=null;
 t.addEventListener('pointerdown',e=>{if(busy||t.classList.contains('used'))return;e.preventDefault();drag=true;moved=false;t.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;const r=t.getBoundingClientRect();c0={x:r.left+r.width/2,y:r.top+r.height/2};t.classList.add('drag');speak(F.letter(c))});
 t.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)>8)moved=true;if(!moved)return;t.style.transform=`translate(${dx}px,${dy}px) scale(1.15)`;
  const s=slotAt(c0.x+dx,c0.y+dy);if(s!==over){over&&over.classList.remove('over');over=s;s&&!s.classList.contains('full')&&s.classList.add('over')}});
 const end=e=>{if(!drag)return;drag=false;t.classList.remove('drag');over&&over.classList.remove('over');over=null;if(e.type!=='pointerup'){t.style.transform='';return}
  if(!moved){const i=filled.indexOf(false);if(i<0)return;if(word[i]===c)place(t,c,i);else wrong(t);return}
  const s=slotAt(c0.x+e.clientX-sx,c0.y+e.clientY-sy);
  if(!s){t.style.transform='';return}
  const i=+s.dataset.i;if(!filled[i]&&word[i]===c)place(t,c,i);else wrong(t)};
 t.addEventListener('pointerup',end);t.addEventListener('pointercancel',end);
}
function hint(){if(busy)return;const i=filled.indexOf(false);if(i<0)return;const t=tiles.find(t=>!t.classList.contains('used')&&t.textContent===word[i]);
 if(t){t.classList.remove('glow');void t.offsetWidth;t.classList.add('glow');setTimeout(()=>t.classList.remove('glow'),2600)}speak(F.word(word))}
function win(){busy=true;$('pic').classList.add('yay');$('slots').classList.add('wave');
 slots().forEach((s,i)=>s.style.animationDelay=(i*.08)+'s');
 [523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.25,i*.1));confetti();
 setTimeout(()=>speak(F.ok(word)),200);
 document.querySelectorAll('#stars span')[round].classList.add('on');round++;setTimeout(next,2800)}
</script>
</body>
</html>
