<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8fd8ff">
<title data-en="Pattern Train">Trem dos Padrões</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--ol:#2d1b4e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
body{font-family:'Lilita One','Comic Sans MS','Chalkboard SE',cursive;color:var(--ol);letter-spacing:.5px;background:linear-gradient(#8fd8ff,#d6f3ff)}
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;z-index:20;gap:8px}
.btn{border:5px solid var(--ol);background:#fff;border-radius:18px;font-size:26px;width:58px;height:58px;flex:none;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 5px 0 var(--ol);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ol)}
#stars{display:flex;gap:2px;font-size:clamp(16px,4vw,28px);background:#fff;border:5px solid var(--ol);box-shadow:0 5px 0 var(--ol);padding:4px 10px;border-radius:20px}
#stars span{filter:grayscale(1);opacity:.3;transition:.4s}
#stars span.on{filter:none;opacity:1;animation:boing .5s}
.cloud{position:fixed;width:120px;animation:drift 34s linear infinite;z-index:0}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(110vw)}}
.hill{position:fixed;border:7px solid var(--ol);border-radius:50%;z-index:1}
#ground{position:fixed;left:-20px;right:-20px;bottom:-10px;background:#7ed957;border-top:7px solid var(--ol);z-index:2}
#rails{position:fixed;left:-20px;right:-20px;height:24px;z-index:3;background:repeating-linear-gradient(90deg,#a0673f 0 16px,transparent 16px 36px);border-top:7px solid #6b6f80;border-bottom:7px solid #6b6f80;box-shadow:0 -3px 0 var(--ol),0 3px 0 var(--ol)}
.q{position:fixed;left:0;right:0;text-align:center;z-index:4;font-size:clamp(26px,6vw,44px);color:#fff;text-shadow:3px 3px 0 var(--ol),-2px -2px 0 var(--ol),2px -2px 0 var(--ol),-2px 2px 0 var(--ol),0 6px 0 var(--ol)}
#train{position:fixed;display:flex;align-items:flex-end;z-index:5;will-change:transform}
.wagon{position:relative;width:var(--w);display:flex;flex-direction:column;align-items:center}
.wagon .bx{width:100%;height:calc(var(--w)*.82);background:var(--c);border:5px solid var(--ol);border-radius:16px 16px 8px 8px;display:flex;align-items:center;justify-content:center;font-size:calc(var(--w)*.52);line-height:1;box-shadow:inset 0 -8px 0 rgba(0,0,0,.15)}
.wagon .bx.q2{background:#fff;border-style:dashed;color:#ff5d8f;font-size:calc(var(--w)*.5);animation:pulse 1s ease-in-out infinite}
.wagon .bx.fill{animation:boing .5s}
.wagon.hop .bx{animation:hopw .3s}
@keyframes hopw{50%{transform:translateY(-28%)}}
@keyframes pulse{50%{transform:scale(1.07)}}
.whs{display:flex;justify-content:space-around;width:100%;margin-top:-8px}
.wh{width:calc(var(--w)*.32);height:calc(var(--w)*.32);border-radius:50%;border:5px solid var(--ol);background:conic-gradient(#ffd23f 0 25%,#ff9f43 0 50%,#ffd23f 0 75%,#ff9f43 0)}
.moving .wh,.moving .lw{animation:spin .35s linear infinite}
.lw{transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.link{width:calc(var(--w)*.14);height:8px;background:var(--ol);margin-bottom:calc(var(--w)*.3);border-radius:4px;flex:none}
#loco{display:block;overflow:visible}
.puff{position:fixed;width:34px;height:34px;border-radius:50%;background:#fff;border:4px solid var(--ol);z-index:4;pointer-events:none;animation:puff 1.3s ease-out forwards}
@keyframes puff{to{transform:translate(-60px,-90px) scale(2.2);opacity:0}}
#opts{position:fixed;left:0;right:0;display:flex;justify-content:center;gap:clamp(14px,5vw,36px);z-index:6}
.opt{border:6px solid var(--ol);background:#fff;border-radius:50%;width:var(--o);height:var(--o);font-size:calc(var(--o)*.55);line-height:1;box-shadow:0 8px 0 var(--ol);cursor:pointer;transition:transform .15s,opacity .3s;animation:boing .5s backwards;font-family:inherit}
.opt:active{transform:translateY(5px);box-shadow:0 3px 0 var(--ol)}
.opt.ok{background:#8ac926}
.opt.no{opacity:.35;animation:shake .45s;pointer-events:none}
#opts.off{pointer-events:none;opacity:.5}
@keyframes boing{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{20%{transform:translateX(-12px) rotate(-5deg)}40%{transform:translateX(10px) rotate(5deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-20px) rotate(8deg)}}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(45,27,78,.45);z-index:80;padding:16px}
.overlay.show{display:flex}
.box{background:#fff;border:7px solid var(--ol);border-radius:36px;padding:26px 22px;text-align:center;max-width:480px;width:100%;box-shadow:0 12px 0 var(--ol);animation:boing .5s}
.box .big{font-size:92px;line-height:1;animation:dance 1.2s ease-in-out infinite}
.box h2{font-size:clamp(30px,7vw,44px);color:#ff5d5d;margin:12px 0;text-shadow:3px 3px 0 var(--ol)}
.box p{font-size:22px;margin-bottom:18px}
.play{border:6px solid var(--ol);border-radius:24px;background:#8ac926;color:#fff;font-family:inherit;font-size:32px;padding:10px 36px;box-shadow:0 7px 0 var(--ol);cursor:pointer;text-shadow:2px 2px 0 var(--ol)}
.play:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ol)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
</style>
</head>
<body>
<svg class="cloud" style="top:110px" viewBox="0 0 130 70"><path fill="#fff" stroke="#2d1b4e" stroke-width="5" stroke-linejoin="round" d="M25 62a20 20 0 0 1 2-38a26 26 0 0 1 48-8a22 22 0 0 1 36 18a16 16 0 0 1 -4 28z"/></svg>
<svg class="cloud" style="top:170px;width:80px;animation-duration:50s;animation-delay:-25s" viewBox="0 0 130 70"><path fill="#fff" stroke="#2d1b4e" stroke-width="6" stroke-linejoin="round" d="M25 62a20 20 0 0 1 2-38a26 26 0 0 1 48-8a22 22 0 0 1 36 18a16 16 0 0 1 -4 28z"/></svg>
<div class="hill" id="h1" style="background:#5cc94a"></div><div class="hill" id="h2" style="background:#4cb83c"></div>
<div id="ground"></div><div id="rails"></div>
<div class="top"><a class="btn" href="../index.html">🏠</a><div id="stars"></div><button class="btn" id="say">🔊</button></div>
<div class="q" id="q">Qual vem depois?</div>
<div id="train"></div>
<div id="opts"></div>
<div id="start" class="overlay show"><div class="box"><div class="big">🚂</div><h2 data-en="Pattern Train">Trem dos Padrões</h2><p data-en="Listen to the train and find the missing wagon!">Escute o trem e descubra qual vagão está faltando!</p><button class="play" id="go" data-en="▶ PLAY">▶ JOGAR</button><br><button class="lang-toggle"></button></div></div>
<div id="end" class="overlay"><div class="box"><div class="big">🚂</div><h2 data-en="Choo choo! Champion!">Piuí! Campeão!</h2><p data-en="You completed all the trains! 🎉">Você completou todos os trens! 🎉</p><button class="play" id="again" data-en="🔄 AGAIN">🔄 DE NOVO</button></div></div>

<script src="../comum/voz.js"></script>
<script>
const AC=window.AudioContext||window.webkitAudioContext;let ac;
function tone(f,d=.15,type='sine',vol=.25,delay=0,f2){try{ac=ac||new AC();if(ac.state==='suspended')ac.resume();const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
function confetti(n=160){const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);const W=c.width=innerWidth,H=c.height=innerHeight,x=c.getContext('2d'),cl=['#ff5d8f','#ffd23f','#3bceac','#5e60ce','#ff8c42','#4cc9f0'];const ps=Array.from({length:n},()=>({x:W/2,y:H*.4,vx:(Math.random()-.5)*18,vy:-Math.random()*15-4,s:Math.random()*9+8,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cl[Math.random()*cl.length|0]}));let f=0;(function NW(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.strokeStyle='#2d1b4e';x.lineWidth=2;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.strokeRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<170)requestAnimationFrame(NW);else c.remove()})()}
const $=id=>document.getElementById(id);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];

const SETS=[['🍎','🍌','🍇','🍊','🍓','🥝'],['🐶','🐱','🐰','🐸','🐷','🐵'],['⭐','❤️','🌙','☀️','🌈','⚡'],['🚗','🚀','⚽','🎈','🎁','🍦'],['🐟','🐙','🦀','🐳','🐢','🦈']];
const NOTES=[523.25,659.25,783.99];
const WCOL=['#ff5d5d','#4cc9f0','#ffd23f'];
const LOCO=`<svg id="loco" viewBox="0 0 170 130">
 <rect x="112" y="10" width="26" height="12" rx="4" fill="#2d1b4e"/><rect x="116" y="18" width="18" height="34" fill="#4a4a5e" stroke="#2d1b4e" stroke-width="5"/>
 <rect x="10" y="14" width="76" height="16" rx="6" fill="#ffd23f" stroke="#2d1b4e" stroke-width="5"/>
 <rect x="16" y="26" width="64" height="74" rx="8" fill="#ff5d5d" stroke="#2d1b4e" stroke-width="5"/>
 <rect x="28" y="38" width="40" height="28" rx="6" fill="#bfefff" stroke="#2d1b4e" stroke-width="5"/>
 <rect x="74" y="50" width="80" height="50" rx="22" fill="#4cc9f0" stroke="#2d1b4e" stroke-width="5"/>
 <circle cx="152" cy="75" r="24" fill="#ffd23f" stroke="#2d1b4e" stroke-width="5"/>
 <circle cx="145" cy="70" r="4" fill="#2d1b4e"/><circle cx="159" cy="70" r="4" fill="#2d1b4e"/><path d="M143 82Q152 90 161 82" fill="none" stroke="#2d1b4e" stroke-width="4" stroke-linecap="round"/>
 <ellipse cx="139" cy="79" rx="5" ry="3" fill="#ff8aa8"/><ellipse cx="165" cy="79" rx="5" ry="3" fill="#ff8aa8"/>
 <g class="lw"><circle cx="38" cy="108" r="18" fill="#2d1b4e"/><circle cx="38" cy="108" r="11" fill="#ffd23f"/><rect x="36" y="97" width="4" height="22" fill="#2d1b4e"/></g>
 <g class="lw"><circle cx="86" cy="110" r="15" fill="#2d1b4e"/><circle cx="86" cy="110" r="9" fill="#ffd23f"/><rect x="84" y="101" width="4" height="18" fill="#2d1b4e"/></g>
 <g class="lw"><circle cx="126" cy="110" r="15" fill="#2d1b4e"/><circle cx="126" cy="110" r="9" fill="#ffd23f"/><rect x="124" y="101" width="4" height="18" fill="#2d1b4e"/></g>
</svg>`;
/*FALAS*/
const F={
 next:L('Qual vem depois?','What comes next?'),
 miss:L('Qual está faltando?','What is missing?'),
 ok:L('Isso! Muito bem!','Yes! Great job!'),
 no:L('Hmm, escute o trem de novo!','Hmm, listen to the train again!'),
 end:L('Piuí! Você completou todos os trens!','Choo choo! You completed all the trains!')
};
function falas(){return [F.next,F.miss,F.ok,F.no,F.end]}
/*FIM-FALAS*/
const ROUNDS=8;let round=0,seq,unit,miss,answer,Wg,railY,smokeIv,busy=true,NW;
const train=$('train');
$('stars').innerHTML='<span>⭐</span>'.repeat(ROUNDS);
$('go').onclick=()=>{$('start').classList.remove('show');startGame()};
$('again').onclick=()=>{$('end').classList.remove('show');startGame()};
$('say').onclick=()=>{if(!busy){playPattern();speak($('q').textContent)}};

function scene(){const W=innerWidth,H=innerHeight;railY=Math.round(H*(W>H?.6:.55));
 NW=W<560?5:6;Wg=Math.min((W-30)/(NW*1.14+1.7),130,H*.17);
 Object.assign($('rails').style,{top:railY+'px'});Object.assign($('ground').style,{top:railY+10+'px'});
 Object.assign($('h1').style,{left:'-10%',width:'60%',height:H*.35+'px',top:railY-H*.12+'px'});
 Object.assign($('h2').style,{right:'-15%',width:'70%',height:H*.4+'px',top:railY-H*.16+'px'});
 $('q').style.top=Math.max(84,railY-Wg*1.25-90)+'px';
 const o=Math.min(W/4.4,(H-railY-40)*.8,130);$('opts').style.setProperty('--o',o+'px');$('opts').style.top=railY+40+(H-railY-40-o)/2-10+'px'}

function startGame(){round=0;document.querySelectorAll('#stars span').forEach(s=>s.classList.remove('on'));next()}
function next(){
 if(round>=ROUNDS){confetti(220);whistle();speak(F.end);$('end').classList.add('show');return}
 scene();busy=true;
 unit=round<3?[0,1]:round<5?pick([[0,0,1],[0,1,1]]):[0,1,2];
 const set=shuffle([...pick(SETS)]);
 seq=Array.from({length:NW},(_,i)=>({e:set[unit[i%unit.length]],k:unit[i%unit.length]}));
 miss=round>=6?2+(Math.random()*(NW-2)|0):NW-1;answer=seq[miss].e;
 $('q').textContent=miss===NW-1?F.next:F.miss;
 speak.preload([$('q').textContent,F.ok,F.no]);
 let html='';seq.forEach((s,i)=>{html+=`<div class="wagon" style="--w:${Wg}px;--c:${WCOL[s.k]}"><div class="bx${i===miss?' q2':''}">${i===miss?'?':s.e}</div><div class="whs"><div class="wh"></div><div class="wh"></div></div></div><div class="link" style="--w:${Wg}px"></div>`});
 train.innerHTML=html+`<div style="width:${Wg*1.7}px;height:${Wg*1.3}px">${LOCO}</div>`;
 train.querySelector('#loco').style.cssText='width:100%;height:100%';
 const tw=train.offsetWidth,left=(innerWidth-tw)/2;
 Object.assign(train.style,{left:left+'px',top:railY-train.offsetHeight+4+'px',transition:'none',transform:`translateX(${-left-tw-40}px)`});
 void train.offsetWidth;
 const opts=new Set([answer]);unit.forEach(k=>opts.add(set[k]));while(opts.size<3)opts.add(pick(set));
 const op=$('opts');op.innerHTML='';op.classList.add('off');
 shuffle([...opts]).slice(0,3).forEach((e,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=e;b.style.animationDelay=(1.8+i*.1)+'s';b.onclick=()=>choose(b,e);op.appendChild(b)});
 if(![...op.children].some(b=>b.textContent===answer))op.children[0].textContent=answer;
 move('transform 2s cubic-bezier(.2,.8,.3,1)','translateX(0)',2000,()=>{busy=false;op.classList.remove('off');playPattern();setTimeout(()=>speak($('q').textContent),NW*340+200)});
 tone(880,.25,'square',.06);tone(1175,.35,'square',.06,.25);
}
function move(tr,tf,ms,cb){train.classList.add('moving');train.style.transition=tr;train.style.transform=tf;clearInterval(smokeIv);smokeIv=setInterval(puff,170);
 setTimeout(()=>{train.classList.remove('moving');clearInterval(smokeIv);cb&&cb()},ms)}
function puff(){const l=train.querySelector('#loco');if(!l)return;const r=l.getBoundingClientRect(),p=document.createElement('div');p.className='puff';p.style.left=r.left+r.width*(125/170)-17+'px';p.style.top=r.top-20+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),1300)}
function playPattern(full){const ws=[...train.querySelectorAll('.wagon')];
 ws.forEach((w,i)=>setTimeout(()=>{w.classList.remove('hop');void w.offsetWidth;w.classList.add('hop');
  if(i===miss&&!full){tone(1200,.08,'triangle',.15);tone(1400,.08,'triangle',.15,.1)}
  else{tone(NOTES[seq[i].k],.28,'triangle',.28);tone(NOTES[seq[i].k]*2,.2,'sine',.06)}},i*340))}
function whistle(){tone(880,.3,'square',.07);tone(1175,.5,'square',.07,.3)}
function choose(b,e){if(busy)return;
 if(e===answer){busy=true;b.classList.add('ok');$('opts').classList.add('off');
  const bx=train.querySelectorAll('.wagon .bx')[miss];bx.classList.remove('q2');bx.textContent=answer;bx.classList.add('fill');
  speak(F.ok);playPattern(true);
  setTimeout(()=>{confetti();whistle();document.querySelectorAll('#stars span')[round].classList.add('on');round++;
   const left=parseFloat(train.style.left);move('transform 2.2s cubic-bezier(.6,0,.8,.5)',`translateX(${innerWidth-left+60}px)`,2200,next)},NW*340+300)}
 else{b.classList.add('no');tone(260,.3,'sawtooth',.1,0,130);speak(F.no);setTimeout(()=>playPattern(),1400)}
}
addEventListener('resize',()=>{if(!busy){scene();const tw=train.offsetWidth;train.style.left=(innerWidth-tw)/2+'px';train.style.top=railY-train.offsetHeight+4+'px'}});
scene();
</script>
</body>
</html>
